  </style>
  <rect x="0.5" y="0.5" width="839" height="219" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="839" height="219" rx="16" fill="url(#glow)"/>
  <rect x="48" y="40" width="36" height="4" rx="2" fill="url(#accent)"/>
  <g><text x="48" y="96" class="sans name">Bahri Yılmaz</text></g>
  <g><text x="48" y="128" class="sans role">Full-stack developer · Istanbul</text></g>
  <g>
    <text x="48" y="184" class="mono stack">TypeScript  /  Next.js  /  React  /  Node.js  /  ASP.NET Core  /  PostgreSQL</text>
