<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Bahri Yılmaz, full-stack developer in Istanbul">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset=".55" stop-color="#10b981" stop-opacity=".9"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".86" cy=".2" r=".6">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".10"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#cbd5e1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect width="880" height="300" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="878" height="298" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 2.4px; fill: #059669; }
    .name { font-size: 46px; font-weight: 700; letter-spacing: -1.4px; fill: #0b1220; }
    .lead { font-size: 17px; fill: #5b6576; }
    .chip { font-size: 12px; fill: #334155; }
    .loc { font-size: 12px; fill: #5b6576; letter-spacing: .3px; }
  </style>
  <g clip-path="url(#card)">
    <rect width="880" height="300" fill="#ffffff"/>
    <rect width="880" height="300" fill="url(#dots)" mask="url(#dotmask)"/>
    <rect width="880" height="300" fill="url(#glow)"/>
    <circle cx="760" cy="130" r="34" fill="none" stroke="url(#ring)" stroke-opacity="0.9" stroke-width="1"/>
    <circle cx="760" cy="130" r="62" fill="none" stroke="url(#ring)" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="760" cy="130" r="90" fill="none" stroke="url(#ring)" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="760" cy="130" r="118" fill="none" stroke="url(#ring)" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="760" cy="130" r="146" fill="none" stroke="url(#ring)" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="760" cy="130" r="5" fill="url(#accent)"/>
    <circle cx="822" cy="130" r="3" fill="#0ea5e9"/>
    <circle cx="696" cy="48" r="2.5" fill="#10b981" opacity=".8"/>
    <rect x="0" y="0" width="880" height="1.5" fill="url(#edge)"/>
  </g>
  <rect x="1" y="1" width="878" height="298" rx="20" fill="none" stroke="#e6e8ec"/>

  <text x="56" y="70" class="mono eyebrow">FULL-STACK DEVELOPER</text>
  <text x="54" y="124" class="sans name">Bahri Yılmaz</text>
  <text x="56" y="160" class="sans lead">Building web products end to end, from data model to deployment.</text>
  <circle cx="60" cy="191" r="3.5" fill="#10b981"/>
  <text x="72" y="195" class="sans loc">Istanbul, Türkiye</text>
  <g>
    <rect x="56" y="222" width="96" height="28" rx="14" fill="#f6f8fa" stroke="#e6e8ec"/><text x="104.0" y="240.5" text-anchor="middle" class="mono chip">TypeScript</text>
    <rect x="160" y="222" width="75" height="28" rx="14" fill="#f6f8fa" stroke="#e6e8ec"/><text x="197.5" y="240.5" text-anchor="middle" class="mono chip">Next.js</text>
    <rect x="243" y="222" width="60" height="28" rx="14" fill="#f6f8fa" stroke="#e6e8ec"/><text x="273.0" y="240.5" text-anchor="middle" class="mono chip">React</text>
    <rect x="311" y="222" width="75" height="28" rx="14" fill="#f6f8fa" stroke="#e6e8ec"/><text x="348.5" y="240.5" text-anchor="middle" class="mono chip">Node.js</text>
    <rect x="394" y="222" width="111" height="28" rx="14" fill="#f6f8fa" stroke="#e6e8ec"/><text x="449.5" y="240.5" text-anchor="middle" class="mono chip">ASP.NET Core</text>
    <rect x="513" y="222" width="96" height="28" rx="14" fill="#f6f8fa" stroke="#e6e8ec"/><text x="561.0" y="240.5" text-anchor="middle" class="mono chip">PostgreSQL</text>
  </g>
</svg>
